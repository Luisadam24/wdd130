<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Poll Form</title>
</head>
<body>

    <header>
        <h1>User Poll</h1>
    </header>

    <main>
        <form>

            <fieldset>
                <legend>Contact Information</legend>

                <!-- Full Name -->
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <!-- Email -->
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <!-- Favorite Browser -->
                <div class="form-item column1">
                    <label for="browser">What is your favourite internet browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="edge">Edge</option>
                        <option value="firefox">Firefox</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Pet Question -->
                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <!-- Places Lived -->
                <div class="form-item">
                    <label for="places">List the places you have lived:</label>
                    <textarea
                        id="places"
                        name="places"
                        rows="4"
                        placeholder="Harare, Zimbabwe; Cairo, Egypt; Jeddah, Saudi Arabia"></textarea>
                </div>

            </fieldset>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sir Luis Adam</p>
    </footer>

</body>
</html>
